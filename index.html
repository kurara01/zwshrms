<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杂物社 · 人事系统原型</title>
  <link rel="stylesheet" href="./prototype-common.css" />
  <style>
    .landing { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
    .landing-header { margin-bottom: 36px; text-align: center; }
    .landing-header h1 { font-size: 28px; }
    .landing-header p { margin-top: 8px; color: var(--text-secondary); font-size: 15px; }
    .landing-section { margin-bottom: 32px; }
    .landing-section h2 { margin: 0 0 16px; font-size: 16px; color: var(--text-regular); }
    .prototype-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .prototype-card { display: block; padding: 20px; background: var(--surface); border: 1px solid var(--border-lighter); border-radius: var(--radius-md); text-decoration: none; transition: .2s; }
    .prototype-card:hover { border-color: var(--brand); box-shadow: 0 4px 16px rgba(64,158,255,.15); transform: translateY(-2px); }
    .prototype-card .icon { width: 40px; height: 40px; display: grid; place-items: center; color: #fff; background: var(--brand); border-radius: var(--radius-sm); font-size: 18px; }
    .prototype-card .title { margin-top: 12px; font-size: 15px; font-weight: 600; color: var(--text-primary); }
    .prototype-card .desc { margin-top: 4px; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
    .prototype-card .meta { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
    .prototype-card .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; color: var(--brand); background: var(--brand-light); }
    .prototype-card .filesize { color: var(--text-placeholder); font-size: 12px; }
    .landing-footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border-lighter); text-align: center; color: var(--text-placeholder); font-size: 13px; }
    .landing-footer a { color: var(--brand); text-decoration: none; }
    .landing-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="app-shell" style="height:auto;min-height:100vh;display:block">
  <div class="landing">
    <div class="landing-header">
      <h1>📋 杂物社 · 人事系统原型</h1>
      <p>点击卡片查看并操作各页面</p>
    </div>

    <div class="landing-section">
      <div class="prototype-grid">
        <a class="prototype-card" href="组织基础信息表.html">
          <div class="icon">🏢</div>
          <div class="title">组织基础信息表</div>
          <div class="desc">多公司组织树、门店扩展信息、快照与日志</div>
          <div class="meta"><span class="tag page">页面</span></div>
        </a>
        <a class="prototype-card" href="岗位管理.html">
          <div class="icon">👤</div>
          <div class="title">岗位管理</div>
          <div class="desc">岗位名称、多职等、编制占用数量与启停</div>
          <div class="meta"><span class="tag page">页面</span></div>
        </a>
        <a class="prototype-card" href="编制管理.html">
          <div class="icon">📊</div>
          <div class="title">编制管理</div>
          <div class="desc">独立编制席位、生命周期与人员占用结果</div>
          <div class="meta"><span class="tag page">页面</span></div>
        </a>
        <a class="prototype-card" href="社保信息.html">
          <div class="icon">🛡️</div>
          <div class="title">社保信息</div>
          <div class="desc">按门店维护社保缴纳地、基数、费用与成本</div>
          <div class="meta"><span class="tag page">页面</span></div>
        </a>
        <a class="prototype-card" href="标准工时维护.html">
          <div class="icon">⏱️</div>
          <div class="title">标准工时维护</div>
          <div class="desc">按月维护全公司统一的标准工时</div>
          <div class="meta"><span class="tag page">页面</span></div>
        </a>
      </div>
    </div>

    
    <div class="landing-footer">
      <p>九木杂物社 · 人事管理系统（紫言）</p>
    </div>
  </div>
</div>
</body>
</html>
